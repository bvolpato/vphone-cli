name: Guest worker

on:
  workflow_call:

permissions:
  contents: read

jobs:
  worker:
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      SWIFT_JOBS: "4"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check native toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = 27.1

      - name: Build iOS worker
        run: |
          set -euo pipefail
          # Browser asset URLs return HTTP 504; immutable API assets work.
          # SwiftPM's URL mirror retains the dependency manifest's checksum.
          export SWIFTPM_MIRROR_CONFIG="$RUNNER_TEMP/guest-worker-mirrors.json"
          jq -n \
            --arg amdl https://github.com/Lakr233/AppleMobileDeviceLibrary/releases/download/storage.46A6477C-63BC-448A-8EB1-D7A06EC9407D \
            '{version:1,object:[
              {original:"https://github.com/Lakr233/libarchive.xcframework/releases/download/upstream.27cbc7827172.2/libarchive.xcframework.zip",
               mirror:"https://api.github.com/repos/Lakr233/libarchive.xcframework/releases/assets/544687728.zip"},
              {original:($amdl+"/libplist.xcframework.zip"),
               mirror:"https://api.github.com/repos/Lakr233/AppleMobileDeviceLibrary/releases/assets/585647013.zip"},
              {original:($amdl+"/libimobiledevice.xcframework.zip"),
               mirror:"https://api.github.com/repos/Lakr233/AppleMobileDeviceLibrary/releases/assets/585647021.zip"},
              {original:($amdl+"/libimobiledevice_glue.xcframework.zip"),
               mirror:"https://api.github.com/repos/Lakr233/AppleMobileDeviceLibrary/releases/assets/585647023.zip"},
              {original:($amdl+"/libusbmuxd.xcframework.zip"),
               mirror:"https://api.github.com/repos/Lakr233/AppleMobileDeviceLibrary/releases/assets/585647014.zip"},
              {original:($amdl+"/libtatsu.xcframework.zip"),
               mirror:"https://api.github.com/repos/Lakr233/AppleMobileDeviceLibrary/releases/assets/585647020.zip"},
              {original:"https://github.com/Lakr233/openssl-spm/releases/download/storage.3.6.2/libssl.xcframework.zip",
               mirror:"https://api.github.com/repos/Lakr233/openssl-spm/releases/assets/391356290.zip"}
            ]}' > "$SWIFTPM_MIRROR_CONFIG"
          xcodebuild -project VPhoneDaemon/VPhoneDaemon.xcodeproj \
            -scheme vphoned -configuration Release -sdk iphoneos \
            -derivedDataPath .build/GuestWorker -jobs 4 \
            CODE_SIGNING_ALLOWED=NO SUPPORTS_MACCATALYST=NO \
            EFFECTIVE_PLATFORM_NAME=-iphoneos build 2>&1 | tee guest-worker-build.log

      - name: Sign and verify iOS worker
        run: |
          set -euo pipefail
          mkdir -p guest-worker
          cp .build/GuestWorker/Build/Products/Release-iphoneos/vphoned guest-worker/vphoned
          worker=guest-worker/vphoned
          nm -u "$worker" > guest-worker/undefined-symbols.txt
          if grep -q '_swift_initBorrow' guest-worker/undefined-symbols.txt; then
            echo 'error: worker requires a Swift runtime symbol unavailable on iOS 26' >&2
            exit 1
          fi
          test "$(lipo -archs "$worker")" = arm64
          install_name_tool -add_rpath /usr/lib/vphone "$worker"
          codesign --force --sign - \
            --entitlements VPhoneDaemon/Configuration/VPhoneDaemon.entitlements "$worker"
          codesign --verify --strict "$worker"
          codesign -d --entitlements - --xml "$worker" > guest-worker/entitlements.plist
          plutil -lint guest-worker/entitlements.plist
          diff -u \
            <(plutil -convert json -o - VPhoneDaemon/Configuration/VPhoneDaemon.entitlements | jq -S .) \
            <(plutil -convert json -o - guest-worker/entitlements.plist | jq -S .)
          digest=$(shasum -a 256 "$worker" | awk '{print $1}')
          jq -n --arg source "$GITHUB_SHA" --arg sha256 "$digest" \
            --arg run "$GITHUB_RUN_ID" --arg sdk "$(xcrun --sdk iphoneos --show-sdk-version)" \
            '{source_revision:$source,sha256:$sha256,run_id:$run,sdk:$sdk,architecture:"arm64",scope:"iOS worker only"}' \
            > guest-worker/manifest.json

      - name: Upload signed worker
        uses: actions/upload-artifact@v4
        with:
          name: vphoned-${{ github.sha }}
          path: guest-worker/
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: guest-worker-logs-${{ github.sha }}
          path: guest-worker-build.log
          if-no-files-found: ignore
