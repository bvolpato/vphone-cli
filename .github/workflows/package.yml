name: package

on:
  workflow_dispatch:
    inputs:
      component:
        description: Build the full release or only the signed iOS worker
        type: choice
        options: [bundle, worker]
        default: bundle

permissions:
  contents: read

jobs:
  package:
    if: inputs.component != 'worker'
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      CAPTURE_SCHEMA_EXTRACTOR_REVISION: cd3996ad8b44f486dd619bacb3a584e671c8ae1f
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify pinned public artifact access
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/pinned-public-artifact-probe"
          mkdir -p "$probe"
          gh release download storage.46A6477C-63BC-448A-8EB1-D7A06EC9407D \
            --repo Lakr233/AppleMobileDeviceLibrary \
            --pattern libplist.xcframework.zip --dir "$probe"
          printf '56fa88f3bd1f847ab8f4053728f93c099ee78032d8cf5b4c38c210a270b22125  %s\n' \
            "$probe/libplist.xcframework.zip" | shasum -a 256 -c -

      - name: Use original pinned artifact URLs
        run: |
          set -euo pipefail
          mirror_config="$RUNNER_TEMP/bundle-mirrors.json"
          printf '{"version":1,"object":[]}\n' > "$mirror_config"
          echo "SWIFTPM_MIRROR_CONFIG=$mirror_config" >> "$GITHUB_ENV"

      - name: Native display and worker regressions
        run: |
          zsh scripts/tests/stage-package-notices-tests.zsh
          zsh VPhoneDaemon/Tests/run-display-layout-tests.sh
          zsh VPhoneDaemon/Tests/run-display-capture-tests.sh
          zsh VPhoneDaemon/Tests/run-cached-binary-identity-tests.sh
          sh VPhoneDaemon/Tests/run-health-tests.sh

      - name: DriverKit and patch catalogue regressions
        run: |
          set -o pipefail
          xcodebuild -hideShellScriptEnvironment -project VPhoneKit/VPhoneKit.xcodeproj \
            -scheme VPhoneArchiveKit -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath .build/XcodeKit -jobs 4 CODE_SIGNING_ALLOWED=NO build \
            2>&1 | tee firmware-tests.log
          xcodebuild -hideShellScriptEnvironment -workspace VPhone.xcworkspace \
            -scheme FirmwarePatcherTests -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath .build/XcodeFirmwareTests -jobs 4 \
            -only-testing:FirmwarePatcherTests/CustomFirmwareDriverKitTests \
            -only-testing:FirmwarePatcherTests/CustomFirmwareLocationdCohortingTests \
            -only-testing:FirmwarePatcherTests/DeviceTreeGuestDeviceTests \
            -only-testing:FirmwarePatcherTests/FirmwarePatchSetCatalogTests test \
            2>&1 | tee -a firmware-tests.log

      - name: Verify pinned capture result schema
        run: |
          set -euo pipefail
          extractor="$RUNNER_TEMP/capture-schema-extractor"
          git init --quiet "$extractor"
          git -C "$extractor" fetch --quiet --depth=1 \
            https://github.com/bvolpato/vphone-cli.git "$CAPTURE_SCHEMA_EXTRACTOR_REVISION"
          git -C "$extractor" checkout --quiet --detach FETCH_HEAD
          zsh VPhoneDaemon/Tests/run-display-capture-schema-check.sh \
            "$extractor" "$CAPTURE_SCHEMA_EXTRACTOR_REVISION"
          syntax="$extractor/VPhoneDaemon/Tests/ResultSchema/.build/checkouts/swift-syntax"
          echo "CAPTURE_SCHEMA_SWIFTSYNTAX_REVISION=$(git -C "$syntax" rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build VPhone.bundle
        env:
          SWIFT_JOBS: "4"
        run: |
          set -o pipefail
          xcodebuild -hideShellScriptEnvironment -workspace VPhone.xcworkspace -scheme VPhone \
            -configuration Release -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath .build/XcodeBundle -jobs 4 build \
            2>&1 | tee vphone-build.log

      - name: Verify resolved dependency pins
        run: |
          set -euo pipefail
          while IFS= read -r resolved; do
            diff -u \
              <(git show "HEAD:$resolved" | jq -S '.pins | sort_by(.identity)') \
              <(jq -S '.pins | sort_by(.identity)' "$resolved")
          done < <(git ls-files '*Package.resolved')

      - name: Validate and package VPhone.bundle
        run: |
          set -euo pipefail
          bundle=.build/XcodeBundle/Build/Products/Release/VPhone.bundle
          zsh VPhoneExecutable/VPhoneVirtualization/Build/ValidateBundle.sh "$bundle"
          # Xcode before 27 drops arm64e.x1 without a warning, and M6 hosts
          # need that slice of the AMFI allowlist tool.
          archs=" $(lipo -archs "$bundle/Contents/MacOS/vphone-escalator") "
          for arch in arm64e arm64e.x1; do
            [[ "$archs" == *" $arch "* ]] || { echo "::error::vphone-escalator lacks $arch"; exit 1; }
          done
          ditto -c -k --keepParent "$bundle" "VPhone-${GITHUB_SHA}.zip"

      - name: Build vphone-launchpad.app
        run: |
          set -o pipefail
          xcodebuild -hideShellScriptEnvironment -project VPhoneLaunchpad/VPhoneLaunchpad.xcodeproj \
            -scheme VPhoneLaunchpad -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath .build/XcodeLaunchpad build \
            2>&1 | tee launchpad-build.log

      - name: Package Linux guest resources
        run: |
          set -euo pipefail
          zsh VPhoneExecutable/VPhoneVirtualization/Build/PackageLinuxResources.sh \
            .build/XcodeBundle/Build/Products/Release/VPhone.bundle \
            "vphone-linux-resources-${GITHUB_SHA}.zip"

      - name: Verify Linux backend extraction contract
        run: |
          set -euo pipefail
          backend="$RUNNER_TEMP/linux-backend-contract"
          git init --quiet "$backend"
          git -C "$backend" fetch --quiet --depth=1 \
            https://github.com/bvolpato/vphone-linux.git \
            7803767f73377d6a50ace73c5a5adaf156830cfa
          git -C "$backend" checkout --quiet --detach FETCH_HEAD
          zsh VPhoneExecutable/VPhoneVirtualization/Build/CheckLinuxResourceContract.sh \
            "$backend" "vphone-linux-resources-${GITHUB_SHA}.zip" \
            .build/XcodeBundle/Build/Products/Release/VPhone.bundle

      - name: Package unsigned vphone-launchpad.app
        run: |
          set -euo pipefail
          app=.build/XcodeLaunchpad/Build/Products/Release/vphone-launchpad.app
          ditto -c -k --keepParent "$app" "vphone-launchpad-${GITHUB_SHA}.zip"

      - name: Record bundle provenance
        run: |
          set -euo pipefail
          bundle=.build/XcodeBundle/Build/Products/Release/VPhone.bundle
          jq -n --arg source "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" \
            --arg sdk "$(xcrun --sdk iphoneos --show-sdk-version)" \
            --arg bundle_sha256 "$(shasum -a 256 "VPhone-${GITHUB_SHA}.zip" | awk '{print $1}')" \
            --arg launchpad_sha256 "$(shasum -a 256 "vphone-launchpad-${GITHUB_SHA}.zip" | awk '{print $1}')" \
            --arg worker_sha256 "$(shasum -a 256 "$bundle/Contents/Resources/guest-resources/vphoned" | awk '{print $1}')" \
            --arg linux_resources_sha256 "$(shasum -a 256 "vphone-linux-resources-${GITHUB_SHA}.zip" | awk '{print $1}')" \
            --arg schema_extractor "$CAPTURE_SCHEMA_EXTRACTOR_REVISION" \
            --arg schema_syntax "$CAPTURE_SCHEMA_SWIFTSYNTAX_REVISION" \
            --slurpfile daemon_pins VPhoneDaemon/VPhoneDaemon.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved \
            '{source_revision:$source,run_id:$run,sdk:$sdk,architecture:"arm64",scope:"full bundle, separate unsigned launchpad and Linux guest resources",bundle_sha256:$bundle_sha256,launchpad_sha256:$launchpad_sha256,linux_resources_sha256:$linux_resources_sha256,worker_sha256:$worker_sha256,daemon_pins:$daemon_pins[0].pins,backend_contract_revision:"7803767f73377d6a50ace73c5a5adaf156830cfa",capture_schema_validation:{extractor_revision:$schema_extractor,swift_syntax_revision:$schema_syntax}}' \
            > bundle-manifest.json

      - name: Upload Release packages
        uses: actions/upload-artifact@v4
        with:
          name: vphone-release-${{ github.sha }}
          path: |
            VPhone-${{ github.sha }}.zip
            vphone-launchpad-${{ github.sha }}.zip
            vphone-linux-resources-${{ github.sha }}.zip
            vphone-linux-resources-${{ github.sha }}.json
            bundle-manifest.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vphone-package-logs-${{ github.sha }}
          path: |
            vphone-build.log
            launchpad-build.log
            firmware-tests.log
          if-no-files-found: ignore

  worker:
    if: inputs.component == 'worker'
    uses: ./.github/workflows/guest-worker.yml
