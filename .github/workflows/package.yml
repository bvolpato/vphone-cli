name: Cached worker identity validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: xcode-27
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Check native file identity and confirmation
        run: VPhoneDaemon/Tests/run-cached-binary-identity-tests.sh
      - name: Check existing Swift logic
        run: VPhoneDaemon/Tests/run-logic-tests.sh
